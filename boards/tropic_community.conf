CONFIG_PINCTRL=y
CONFIG_CLOCK_CONTROL=y
CONFIG_DMA=y

# Console and shell over USB CDC-ACM (the board dts selects cdc_acm_uart0), on
# the same cable used to flash.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Tropic Community VMU"

CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_INPUT_SHELL=y
CONFIG_INPUT_CRSF=y
CONFIG_INPUT_CRSF_SEND_SYNC=y
CONFIG_INPUT_CRSF_REPORT_FILTER=1
CONFIG_INPUT_CRSF_THREAD_PRIORITY=1
CONFIG_INPUT_CRSF_THREAD_STACK_SIZE=2048
CONFIG_INPUT_CRSF_USE_DTCM_FOR_DMA_BUFFER=y

CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_SENSOR_SHELL=y
CONFIG_I2C_SHELL=y

# Magnetometer off for the first bring-up. The interface only applies a mount
# yaw, but the IST8310 in the GPS puck also has its z axis opposite to the
# IMU's (cerebri remaps it with -z), so enabling it as is would feed the
# estimator an inverted vertical field. The onboard BMM350 reads about 1.35 G
# near the board electronics, so it is not an alternative.
CONFIG_IST8310=y
CONFIG_RDD2_MAGNETOMETER=n

CONFIG_GNSS=y

# Record the flight bus to the Teensy's microSD slot (usdhc1).
CONFIG_RDD2_FLIGHT_LOG=y
CONFIG_RDD2_FLIGHT_LOG_LOG_LEVEL_INF=y

# The flight log draws its session ids from sys_rand_get/sys_csrand_get. On
# mr_vmu_tropic networking pulls in an entropy source; here, use the RT1062's
# TRNG (enabled in the SoC dtsi) directly.
CONFIG_ENTROPY_GENERATOR=y

# The Teensy 4.1 SD slot has no card-detect line, so the usdhc driver warns
# "assuming card is present" on every presence check the logger makes, which
# floods the deferred log buffer and drops real records. Keep its errors only.
CONFIG_SDHC_LOG_LEVEL_ERR=y
