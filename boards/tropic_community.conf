CONFIG_PINCTRL=y
CONFIG_CLOCK_CONTROL=y
CONFIG_DMA=y

# Console/shell over USB CDC-ACM (see the board dts's cdc_acm_uart0 node,
# selected as zephyr,console/zephyr,shell-uart) - no debug UART adapter
# needed, same USB cable used to flash. Matches cerebri/app/hab's config.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Tropic Community VMU"

CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_INPUT_SHELL=y
CONFIG_INPUT_CRSF=y
CONFIG_INPUT_CRSF_SEND_SYNC=y
CONFIG_INPUT_CRSF_REPORT_FILTER=1
CONFIG_INPUT_CRSF_THREAD_PRIORITY=1
CONFIG_INPUT_CRSF_THREAD_STACK_SIZE=2048
CONFIG_INPUT_CRSF_USE_DTCM_FOR_DMA_BUFFER=y

CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_SENSOR_SHELL=y

CONFIG_GNSS=y

# TODO: no magnetometer/barometer/buzzer support exists in this app yet -
# tropic_community's actual hardware has all three (ist8310 mag on lpi2c1,
# bmm350 mag, bme280 baro on lpi2c4, buzzer on flexpwm3_pwm1), but this
# codebase's estimator (Estimation.ComplementaryAttitude) and app source
# have no wiring for them at all, unlike the working cerebri/app/hab setup.
# Deliberately NOT enabling their Kconfig here until that app-level work is
# done - see the port plan discussion for why mag correction matters for
# this vehicle specifically (long-duration flight, no reliable GNSS-course
# heading reference at low speed, unlike a fast-moving multirotor).
