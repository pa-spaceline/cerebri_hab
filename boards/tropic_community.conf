CONFIG_PINCTRL=y
CONFIG_CLOCK_CONTROL=y
CONFIG_DMA=y

# Console/shell over USB CDC-ACM (see the board dts's cdc_acm_uart0 node,
# selected as zephyr,console/zephyr,shell-uart) - no debug UART adapter
# needed, same USB cable used to flash. Matches cerebri/app/hab's config.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Tropic Community VMU"

CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_INPUT_SHELL=y
CONFIG_INPUT_CRSF=y
CONFIG_INPUT_CRSF_SEND_SYNC=y
CONFIG_INPUT_CRSF_REPORT_FILTER=1
CONFIG_INPUT_CRSF_THREAD_PRIORITY=1
CONFIG_INPUT_CRSF_THREAD_STACK_SIZE=2048
CONFIG_INPUT_CRSF_USE_DTCM_FOR_DMA_BUFFER=y

CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_SENSOR_SHELL=y
CONFIG_IST8310=y

CONFIG_GNSS=y

CONFIG_PWM=y

# TODO: no barometer support exists in this app yet - tropic_community's
# actual hardware has one (bme280 on lpi2c4), but this app's estimator (now
# cyecca's attitude_estimator, swapped in from Rumoca/
# Estimation.ComplementaryAttitude) doesn't do position/altitude estimation
# at all yet, unlike cerebri/app/hab's full baro+GPS EKF. Deliberately NOT
# enabling its Kconfig here until that work is done. Magnetometer (ist8310)
# and buzzer ARE wired now - see attitude_estimator.c/main.c and buzzer.c.
